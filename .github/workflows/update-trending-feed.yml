name: Update Trending Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write

jobs:
  update-trending-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build trending feed
        run: node projects/selected-gitHub-projects/scripts/build-trending-feed.js

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/selected-gitHub-projects/data/trending-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Update trending feed"
          git push
